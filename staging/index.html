<!DOCTYPE html>
<html>
<head>
    <title>Staging Site</title>
</head>

<body>

<div id="gate" style="font-family: sans-serif; max-width: 400px; margin: 
100px auto; text-align:center;">
    <h1>Staging Site</h1>
    <p>This is a work-in-progress preview. Enter the password to 
continue.</p>

    <input type="password" id="pw" style="padding:8px;">
    <button onclick="checkPw()" style="padding:8px;">Enter</button>

    <p id="err" style="color:red; display:none;">Incorrect password.</p>
</div>

<div id="content" style="display:none;">

    <h1>Staging — under construction</h1>
    <p>Password accepted. This is the staging environment.</p>

</div>

<script>
function checkPw() {

    const entered = document.getElementById('pw').value;

    if (entered === "Staging123!") {

        document.getElementById('gate').style.display = 'none';
        document.getElementById('content').style.display = 'block';

    } else {

        document.getElementById('err').style.display = 'block';

    }
}
</script>

</body>
</html>
